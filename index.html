<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <title>Alera Psychology | Calgary</title>
  <meta name="description" content="Alera Psychology — Psychological Services in Calgary.">
  <link rel="stylesheet" href="https://use.typekit.net/sfh2fbl.css">
  <style>
    :root {
      --green-dark: #42574a;
      --green-mid: #657e63;
      --green-deep: #2a3830;
      --charcoal: #3a3a38;
      --cream-warm: #fef9ed;
      --cream-light: #e3e4df;
      --blush: #f6e5d9;
      --white: #ffffff;
      --font-display: "Argent CF", Georgia, serif;
      --font-body: "Raleway", sans-serif;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      font-family: var(--font-body);
      background: var(--green-dark);
      color: var(--white);
    }

  
    @keyframes drift {

      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-20px, 24px);
      }
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      padding-top: calc(4rem + env(safe-area-inset-top, 0px));
      padding-bottom: calc(4rem + env(safe-area-inset-bottom, 0px));
      text-align: center;
    }

    /* logo */
    .logo {
      margin-bottom: 2.8rem;
      animation: up .7s ease .05s both;
    }

    .logo-img {
      display: block;
      height: 80px;
      width: auto;
      margin: 0 auto;
    }

    /* divider */
    .divider {
      width: 48px;
      height: 1.5px;
      background: var(--green-mid);
      opacity: 0.35;
      margin: 0 auto 2.2rem;
      border-radius: 2px;
      animation: up .7s ease .15s both;
    }

    .step-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 500;
      color: var(--white);
      margin-bottom: 0.7rem;
      animation: up .7s ease .15s both;
    }

    /* headline */
    h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3.8rem);
      font-weight: 400;
      line-height: 1.12;
      color: var(--white);
      margin-bottom: 1rem;
      animation: up .7s ease .2s both;
    }

    h1 em {
      font-style: italic;
      color: var(--white);
    }

    /* body copy */
    .body-text {
      font-size: clamp(14px, 2vw, 16px);
      color: var(--white);
      opacity: 0.65;
      line-height: 1.75;
      /* max-width: 360px; */
      margin-bottom: 2.8rem;
      animation: up .7s ease .28s both;
    }

    /* contact card */
    .card {
      background: var(--white);
      border-radius: 20px;
      padding: 2rem 2.4rem;
      box-shadow: 0 8px 40px rgba(42, 56, 48, 0.09);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 280px;
      max-width: 360px;
      /* width: 100%; */
      animation: up .7s ease .36s both;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      text-decoration: none;
      color: var(--charcoal);
      transition: color 0.2s;
    }

    .contact-row:hover {
      color: var(--green-dark);
    }

    .c-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      background: var(--blush);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .contact-row:hover .c-icon {
      background: var(--cream-light);
    }

    .c-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green-mid);
      display: block;
      margin-bottom: 1px;
      font-family: var(--font-body);
    }

    .c-val {
      font-size: 14px;
      font-weight: 400;
      font-family: var(--font-body);
    }

    .card-divider {
      height: 1px;
      background: rgba(66, 87, 74, 0.08);
    }

    /* footer */
    footer {
      margin-top: 2.8rem;
      font-size: 11px;
      font-family: var(--font-body);
      color: var(--white);
      opacity: 0.3;
      letter-spacing: 0.06em;
      animation: up .7s ease .44s both;
    }

    @keyframes up {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 400px) {
      .card {
        padding: 1.6rem;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="logo">
      <img
        src="images/alera-logo-2.png"
        alt="Alera Psychology" class="logo-img">
    </div>

    <div class="divider"></div>

    <p class="step-title">Our website is currently being developed.</p>

    <p class="body-text">In the meantime, please reach out. We'd love to hear from you.</p>

    <!-- Contact card -->
    <div class="card">

      <a href="tel:825-521-2772" class="contact-row">
        <div class="c-icon">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
            <path
              d="M5.5 2.5H3.5C2.9 2.5 2.5 2.9 2.5 3.5C2.5 10.5 6.5 14.5 13.5 14.5C14.1 14.5 14.5 14.1 14.5 13.5V11.5L11.5 10.5L10.5 12C8.5 11.3 5.7 8.5 5 6.5L6.5 5.5L5.5 2.5Z"
              stroke="#42574a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div>
          <span class="c-label">Phone</span>
          <span class="c-val">825-521-2772</span>
        </div>
      </a>

      <div class="card-divider"></div>

      <a href="mailto:deepak.singh@alerapsychology.ca" class="contact-row">
        <div class="c-icon">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
            <rect x="2" y="4" width="13" height="10" rx="2" stroke="#42574a" stroke-width="1.4" />
            <path d="M2 6.5L8.5 10.5L15 6.5" stroke="#42574a" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </div>
        <div>
          <span class="c-label">Email</span>
          <span class="c-val">deepak.singh@alerapsychology.ca</span>
        </div>
      </a>

      <div class="card-divider"></div>

      <div class="contact-row">
        <div class="c-icon">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
            <path d="M8.5 2C5.7 2 3.5 4.2 3.5 7C3.5 10.5 8.5 15 8.5 15C8.5 15 13.5 10.5 13.5 7C13.5 4.2 11.3 2 8.5 2Z"
              stroke="#42574a" stroke-width="1.4" />
            <circle cx="8.5" cy="7" r="2" stroke="#42574a" stroke-width="1.4" />
          </svg>
        </div>
        <div>
          <span class="c-label">Location</span>
          <span class="c-val">Suite 214, 30 Springborough Blvd, Calgary, AB</span>
        </div>
      </div>

    </div>

    <footer>© 2026 Alera Psychology · Calgary, Alberta</footer>

  </main>

</body>

</html>
